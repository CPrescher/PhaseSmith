name: Positional reproducibility diagnostic
on:
  push:
    branches: [codex/release-0.8-preparation]
    paths:
      - .github/workflows/reproducibility.yml
      - benchmarks/cell_comparison_reproducibility.py
      - python/phasesmith/single_crystal/cell_comparison.py
      - python/phasesmith/single_crystal/cell_metrics.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8.0.0
        with:
          name: distributions-macos-x86_64
          run-id: 41699952961
          github-token: ${{ github.token }}
          path: diagnostic-wheel
      - run: python -m pip install numpy pytest threadpoolctl 'gemmi>=0.7.5,<0.8'
      - name: Reuse unchanged native kernels with current Python coordinator sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path("diagnostic-wheel").glob("*.whl"))) as wheel:
              name = next(n for n in wheel.namelist() if n.startswith("phasesmith/_core.") and n.endswith(".so"))
              (Path("python") / name).write_bytes(wheel.read(name))
          PY
      - run: python benchmarks/cell_comparison_reproducibility.py --trace --check --repetitions 100 --output cell-repro
        env:
          PYTHONPATH: ${{ github.workspace }}/python
      - run: python -m pytest -q tests/test_experimental_cell_comparison.py
        env:
          PYTHONPATH: ${{ github.workspace }}/python
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: intel-cell-reproducibility
          path: cell-repro/
