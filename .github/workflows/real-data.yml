name: Checksum-pinned real-data validation

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

concurrency:
  group: real-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest numpy 'gemmi>=0.7.5,<0.8' 'mpmath>=1.3,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - name: Fetch and run every reviewed validation outcome
        run: >-
          python tools/validate_real_data.py
          --fetch
          --include-diagnostics
          --data-directory validation/data
          --output validation/results/scheduled.json
      - name: Fetch fixed-spectrum Pawley regression data
        run: >-
          python -c "from phasesmith.validation import fetch_validation_dataset;
          fetch_validation_dataset('iucr-ceria-size-strain-round-robin',
          'validation/data/iucr-ceria-size-strain-round-robin')"
      - name: Run Pawley measured acceptance contracts
        run: |
          python -m phasesmith.validation.pawley --data-root validation/data \
            --manifest validation/pawley-matrix-free-acceptance-v4.json \
            --output validation/results/scheduled-pawley-cw.json
          python -m phasesmith.validation.pawley --data-root validation/data \
            --manifest validation/pawley-cell-acceptance-v3.json \
            --output validation/results/scheduled-pawley-cell.json
          python -m phasesmith.validation.tof_pawley --data-root validation/data \
            --manifest validation/pawley-tof-acceptance-v1.json \
            --output validation/results/scheduled-pawley-tof.json
          python -m phasesmith.validation.pawley_spectrum \
            --oracle-fixture oracle/fixtures/wavelength_components_v1 \
            --data-root validation/data/iucr-ceria-size-strain-round-robin \
            --output validation/results/scheduled-pawley-spectrum.json
      - name: Exercise Python integration contracts
        run: python -m pytest -q -m real_data tests/test_real_data_integration.py
      - name: Exercise external Rust reader and CLI contracts
        run: |
          cargo test --release -p phasesmith-io --test powder \
            reads_pinned_powgen_tof_bank_without_angle_conversion -- --ignored --exact
          cargo test --release -p phasesmith-validation --test cli \
            cli_exit_status_distinguishes_accepted_and_reviewed_failure_results \
            -- --ignored --exact
      - name: Upload reviewed report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: real-data-validation-${{ github.run_id }}
          path: validation/results/scheduled*.json
          if-no-files-found: warn
          retention-days: 90
