name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: version
        name: Validate synchronized versions and tag
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python scripts/release_version.py \
              --tag "$GITHUB_REF_NAME" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_version.py --github-output "$GITHUB_OUTPUT"
          fi
      - name: Verify bundled skill and documentation match canonical sources
        run: python scripts/sync_skill.py --check

  linux-wheels:
    name: Linux wheel (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - name: Test native wheel
        if: matrix.target == 'x86_64'
        run: |
          python -m pip install numpy pytest 'gemmi>=0.7.5,<0.8'
          python -m pip install --no-deps --no-index --find-links dist phasesmith
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos-wheels:
    name: macOS wheel (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - name: Test native wheel
        run: |
          python -m pip install numpy pytest 'gemmi>=0.7.5,<0.8'
          python -m pip install --no-deps --no-index --find-links dist phasesmith
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows-wheels:
    name: Windows wheel (x86-64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build Windows wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: x64
          args: --release --locked --out dist
      - name: Test native wheel
        shell: pwsh
        run: |
          python -m pip install numpy pytest 'gemmi>=0.7.5,<0.8'
          python -m pip install --no-deps --no-index --find-links dist phasesmith
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-windows-x86_64
          path: dist/*
          if-no-files-found: error

  source-distribution:
    name: Python source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Test source distribution
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install pytest 'gemmi>=0.7.5,<0.8' "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python -m pytest -q -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-sdist
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release distributions
    if: github.event_name == 'push'
    needs: [linux-wheels, macos-wheels, windows-wheels, source-distribution]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: github.event_name == 'push'
    needs: [linux-wheels, macos-wheels, windows-wheels, source-distribution]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phasesmith
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-crates:
    name: Publish Rust crates to crates.io
    if: >-
      github.event_name == 'push' &&
      vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/phasesmith
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish public workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          cargo publish --workspace --locked \
            --exclude phasesmith-py \
            --exclude phasesmith-validation

  github-release:
    name: Publish GitHub Release
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.attest.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    needs:
      - validate
      - linux-wheels
      - macos-wheels
      - windows-wheels
      - source-distribution
      - attest
      - publish-pypi
      - publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "PhaseSmith $RELEASE_VERSION"
