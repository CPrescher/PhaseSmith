name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: version
        name: Validate synchronized versions and tag
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python scripts/release_version.py \
              --tag "$GITHUB_REF_NAME" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_version.py --github-output "$GITHUB_OUTPUT"
          fi
      - name: Verify bundled skill and documentation match canonical sources
        run: python scripts/sync_skill.py --check

  rust-packages:
    name: Verify public Rust packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify dependency-ordered workspace without uploading
        run: cargo publish --workspace --locked --dry-run --exclude phasesmith-py --exclude phasesmith-validation
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: rust-crate-archives
          path: target/package/tmp-crate/*.crate
          if-no-files-found: error

  documentation:
    name: Verify release documentation
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt
      - run: python scripts/sync_math_docs.py --check
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: release-documentation
          path: site/
          if-no-files-found: error

  linux-wheels:
    name: Linux wheel (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-22.04
          - target: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --features hdf5 --out dist
          manylinux: auto
          before-script-linux: python3 -m pip install "cmake>=3.26"
      - name: Test native wheel
        run: |
          python -m pip install numpy pytest jsonschema scipy 'gemmi>=0.7.5,<0.8' 'mpmath>=1.3,<2'
          python -m pip install --no-deps --no-index --find-links dist phasesmith
          python scripts/smoke_single_crystal.py --hdf5-fixture crates/phasesmith-hdf5/tests/data/counts-bitshuffle-lz4.h5
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos-wheels:
    name: macOS wheel (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --features hdf5 --out dist
      - name: Test native wheel
        run: |
          python -m pip install numpy pytest jsonschema scipy 'gemmi>=0.7.5,<0.8' 'mpmath>=1.3,<2'
          python -m pip install --no-deps --no-index --find-links dist phasesmith
          python scripts/smoke_single_crystal.py --hdf5-fixture crates/phasesmith-hdf5/tests/data/counts-bitshuffle-lz4.h5
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows-wheels:
    name: Windows wheel (x86-64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
      - name: Check native example assets before compiling
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_single_crystal_native_assets.py
      - name: Build Windows wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: x64
          args: --release --locked --features hdf5 --out dist
      - name: Test native wheel
        shell: pwsh
        run: |
          python -m pip install numpy pytest jsonschema scipy 'gemmi>=0.7.5,<0.8' 'mpmath>=1.3,<2'
          python -m pip install --no-deps --no-index --find-links dist phasesmith
          python scripts/smoke_single_crystal.py --hdf5-fixture crates/phasesmith-hdf5/tests/data/counts-bitshuffle-lz4.h5
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-windows-x86_64
          path: dist/*
          if-no-files-found: error

  source-distribution:
    name: Python source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Test source distribution
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install pytest jsonschema scipy "cmake>=3.26" 'gemmi>=0.7.5,<0.8' 'mpmath>=1.3,<2' "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python "$GITHUB_WORKSPACE/scripts/smoke_single_crystal.py" --hdf5-fixture "$GITHUB_WORKSPACE/crates/phasesmith-hdf5/tests/data/counts-bitshuffle-lz4.h5"
          python -m pytest -q -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: distributions-sdist
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release distributions
    if: github.event_name == 'push'
    needs: [rust-packages, documentation, linux-wheels, macos-wheels, windows-wheels, source-distribution]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: github.event_name == 'push'
    needs: [rust-packages, documentation, linux-wheels, macos-wheels, windows-wheels, source-distribution]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phasesmith
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-crates:
    name: Publish Rust crates to crates.io
    if: >-
      github.event_name == 'push' &&
      vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    needs: [validate, rust-packages, documentation, linux-wheels, macos-wheels, windows-wheels, source-distribution]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/phasesmith
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish public workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        # Crates already carrying this version (from an interrupted run) are
        # skipped, so re-running this job resumes the publication.
        run: |
          published="$(python3 scripts/published_crates.py --version "$RELEASE_VERSION")"
          skip=()
          while IFS= read -r crate; do
            [[ -z "$crate" ]] && continue
            echo "Skipping $crate $RELEASE_VERSION: already on crates.io"
            skip+=(--exclude "$crate")
          done <<< "$published"
          public_count="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import release_version as r; print(len(r.PUBLIC_CRATES))')"
          if (( ${#skip[@]} / 2 == public_count )); then
            echo "Every public crate is already published at $RELEASE_VERSION."
            exit 0
          fi
          cargo publish --workspace --locked \
            --exclude phasesmith-py \
            --exclude phasesmith-validation \
            ${skip[@]+"${skip[@]}"}

  github-release:
    name: Publish GitHub Release
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.attest.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    needs:
      - validate
      - linux-wheels
      - macos-wheels
      - windows-wheels
      - source-distribution
      - attest
      - publish-pypi
      - publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "PhaseSmith $RELEASE_VERSION"
