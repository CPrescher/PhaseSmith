name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench -p phasesmith-core --bench profile --no-run

  rust-windows-persistence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p phasesmith-persistence --all-features --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install --requirement docs/requirements.txt
      - run: python scripts/sync_math_docs.py --check
      - run: mkdocs build --strict

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest numpy ruff 'gemmi>=0.7.5,<0.8'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q
      - name: Run Rust/Python differential contracts
        if: matrix.python-version == '3.14'
        env:
          PHASESMITH_NUMPY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          cargo test -p phasesmith-workflows --all-features -- --ignored
          cargo test -p phasesmith-persistence --all-features \
            numpy_reads_and_rewrites_native_archives_when_configured -- --ignored
      - run: ruff check .
      - run: ruff format --check .
      - run: python benchmarks/profile.py --require-release --warmups 1 --repetitions 3
