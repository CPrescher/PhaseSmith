name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Check supported facade defaults and focused opt-outs
        run: |
          cargo check -p phasesmith-single-crystal --no-default-features --locked
          cargo check -p phasesmith-single-crystal --no-default-features --features spots --locked
          cargo check -p phasesmith-single-crystal --no-default-features --features solution --locked
          cargo check -p phasesmith-single-crystal --no-default-features --features row-search --locked
          cargo check -p phasesmith --locked
          cargo check -p phasesmith --no-default-features --locked
          cargo check -p phasesmith-py --no-default-features --locked
          cargo check -p phasesmith --no-default-features --features spots,solution,row-search --locked
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench -p phasesmith-core --bench profile --no-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "cmake>=3.26"
      - run: cargo check --workspace --all-features --locked

  rust-windows-persistence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p phasesmith-persistence --all-features --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install --requirement docs/requirements.txt
      - run: python scripts/sync_math_docs.py --check
      - run: python scripts/sync_skill.py --check
      - run: mkdocs build --strict

  python:
    runs-on: ubuntu-latest
    # These limits must precede NumPy import, including in the parent process.
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        numpy: ["numpy"]
        include:
          - python-version: "3.12"
            numpy: "numpy==1.26.4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest '${{ matrix.numpy }}' ruff jsonschema scipy 'cmake>=3.26' 'gemmi>=0.7.5,<0.8' 'mpmath>=1.3,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - name: Default wheel includes supported single-crystal capabilities
        run: python scripts/smoke_single_crystal.py --hdf5-fixture crates/phasesmith-hdf5/tests/data/counts-bitshuffle-lz4.h5
      - name: Record NumPy CPU dispatch
        if: matrix.numpy == 'numpy==1.26.4'
        run: python -c "import numpy; numpy.show_runtime()"
      - name: Check minimum-NumPy exact positional reproducibility
        if: matrix.numpy == 'numpy==1.26.4'
        run: |
          python -m pip install threadpoolctl
          python benchmarks/positional_reproducibility.py --output numpy126-repro/startup --check
          OPENBLAS_NUM_THREADS=2 python benchmarks/positional_reproducibility.py --late-limits --output numpy126-repro/late
      - name: Retain minimum-NumPy diagnostic inputs
        if: always() && matrix.numpy == 'numpy==1.26.4'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: numpy126-positional-reproducibility
          path: numpy126-repro/
      - run: python -m pytest -q
      - name: Check both frozen QARR 1g entry points
        if: matrix.python-version == '3.13'
        run: |
          python -c "from phasesmith.validation import fetch_validation_dataset; fetch_validation_dataset('iucr-qarr-1g', 'validation/data/iucr-qarr-1g')"
          python -m pytest -q -m real_data tests/test_real_data_integration.py \
            -k 'qarr_canonical_native_entry_point_regression or qarr_real_pattern_two_thread_regression'
      - name: Run Rust/Python differential contracts
        if: matrix.python-version == '3.14'
        env:
          PHASESMITH_NUMPY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          cargo test -p phasesmith-workflows --all-features -- --ignored
          cargo test -p phasesmith-persistence --all-features \
            numpy_reads_and_rewrites_native_archives_when_configured -- --ignored
      - run: ruff check .
      - run: ruff format --check .
      - run: python benchmarks/profile.py --require-release --warmups 1 --repetitions 3
