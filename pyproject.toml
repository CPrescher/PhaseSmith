[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "phasesmith"
version = "0.8.0"
description = "Powder and single-crystal diffraction calculations in Rust and Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PhaseSmith contributors" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/hdf5/*.txt", "licenses/optimizers/*.txt"]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CPrescher/PhaseSmith"
Documentation = "https://phasesmith.readthedocs.io/"
Repository = "https://github.com/CPrescher/PhaseSmith.git"
Issues = "https://github.com/CPrescher/PhaseSmith/issues"

[project.scripts]
phasesmith = "phasesmith.cli:main"

[project.optional-dependencies]
test = ["scipy>=1.11", "pytest>=8", "jsonschema>=4.18", "gemmi>=0.7.5,<0.8", "mpmath>=1.3,<2"]
dev = ["scipy>=1.11", "pytest>=8", "jsonschema>=4.18", "ruff>=0.12", "gemmi>=0.7.5,<0.8", "mpmath>=1.3,<2"]
refinement = ["scipy>=1.11"]
masking = []  # Native Rust masking; no numerical Python dependency.
cif = ["gemmi>=0.7.5,<0.8"]
single-crystal-example = ["scipy>=1.11", "gemmi>=0.7.5,<0.8"]

[tool.maturin]
manifest-path = "crates/phasesmith-py/Cargo.toml"
python-source = "python"
module-name = "phasesmith._core"
features = ["pyo3/extension-module", "hdf5"]
include = [{ path = "skills/phasesmith-ai-workflows/**/*", format = "sdist" }]

[tool.pytest.ini_options]
addopts = "-ra -m 'not external_oracle and not real_data'"
testpaths = ["tests"]
markers = [
  "external_oracle: requires the exact pinned GSAS-II checkout and compatible binaries",
  "real_data: runs checksum-pinned external real-pattern workflows",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
