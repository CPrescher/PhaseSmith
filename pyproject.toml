[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "phasesmith"
version = "0.1.0"
description = "Fast, validated powder-diffraction profile calculations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PhaseSmith contributors" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8", "gemmi>=0.7.5,<0.8"]
dev = ["pytest>=8", "ruff>=0.12", "gemmi>=0.7.5,<0.8"]
refinement = ["scipy>=1.11"]
cif = ["gemmi>=0.7.5,<0.8"]

[tool.maturin]
manifest-path = "crates/phasesmith-py/Cargo.toml"
python-source = "python"
module-name = "phasesmith._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not external_oracle'"
testpaths = ["tests"]
markers = [
  "external_oracle: requires the exact pinned GSAS-II checkout and compatible binaries",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
