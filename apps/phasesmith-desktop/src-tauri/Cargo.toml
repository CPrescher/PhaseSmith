[package]
name = "phasesmith-tauri"
description = "Thin Tauri host for the Python-free PhaseSmith desktop runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "phasesmith_tauri"

[[bin]]
name = "phasesmith"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
phasesmith-desktop = { path = "../../../crates/phasesmith-desktop" }
phasesmith-persistence = { path = "../../../crates/phasesmith-persistence" }
serde = { version = "1.0", features = ["derive"] }
tauri = "=2.11.5"

[lints]
workspace = true
