[package]
name = "phasesmith-tauri"
description = "Thin Tauri host for the Python-free PhaseSmith desktop runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PhaseSmith contributors"]
license = "MIT"
homepage = "https://github.com/CPrescher/PhaseSmith"
repository = "https://github.com/CPrescher/PhaseSmith"
readme = "../../../README.md"
publish = false

[lib]
name = "phasesmith_tauri"

[[bin]]
name = "phasesmith"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
phasesmith-desktop = { version = "0.1.0", path = "../../../crates/phasesmith-desktop" }
phasesmith-persistence = { version = "0.1.0", path = "../../../crates/phasesmith-persistence" }
serde = { version = "1.0", features = ["derive"] }
tauri = "=2.11.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
