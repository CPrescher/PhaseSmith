[package]
name = "phasesmith-single-crystal"
description = "Native single-crystal diffraction measurements, lattice discovery and structure search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["spots", "solution", "row-search", "grains"]
spots = ["dep:rayon", "dep:sha2", "dep:rustfft"]
solution = ["dep:phasesmith-execution", "dep:phasesmith-crystallography", "dep:rustfft", "dep:ndarray"]
row-search = ["dep:serde", "dep:serde_json"]
grains = ["spots", "dep:nalgebra"]

[dependencies]
rayon = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
phasesmith-execution = { workspace = true, optional = true }
phasesmith-crystallography = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm-aarch64"], optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "solution"
harness = false
required-features = ["solution"]

[[bench]]
name = "candidate_fitting"
harness = false
required-features = ["solution"]

[[bench]]
name = "detect"
harness = false
required-features = ["spots"]

[[example]]
name = "frame_validity"
required-features = ["spots"]

[lints]
workspace = true
