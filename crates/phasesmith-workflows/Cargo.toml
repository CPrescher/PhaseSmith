[package]
name = "phasesmith-workflows"
description = "Application-neutral native workflows for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
phasesmith-single-crystal = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
nalgebra = { workspace = true }
phasesmith-core = { workspace = true }
phasesmith-crystallography = { workspace = true }
phasesmith-engine = { workspace = true }
phasesmith-execution = { workspace = true }
phasesmith-model = { workspace = true }

[features]
single-crystal = [
    "dep:phasesmith-single-crystal",
    "phasesmith-single-crystal?/spots",
    "phasesmith-single-crystal?/solution",
    "phasesmith-single-crystal?/grains",
    "dep:sha2",
]

[dev-dependencies]
criterion = { workspace = true }
phasesmith-io = { workspace = true }

[[bench]]
name = "backgrounds"
harness = false

[[bench]]
name = "lebail"
harness = false

[[bench]]
name = "rietveld"
harness = false

[[bench]]
name = "space_group"
harness = false
required-features = ["single-crystal"]

[lints]
workspace = true
