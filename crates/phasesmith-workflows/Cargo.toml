[package]
name = "phasesmith-workflows"
description = "Application-neutral native workflows for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
phasesmith-single-crystal = { version = "0.8.0", path = "../phasesmith-single-crystal", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
nalgebra = "0.35"
phasesmith-core = { version = "0.8.0", path = "../phasesmith-core" }
phasesmith-crystallography = { version = "0.8.0", path = "../phasesmith-crystallography" }
phasesmith-engine = { version = "0.8.0", path = "../phasesmith-engine" }
phasesmith-execution = { version = "0.8.0", path = "../phasesmith-execution" }
phasesmith-model = { version = "0.8.0", path = "../phasesmith-model" }

[features]
single-crystal = ["phasesmith-single-crystal/spots", "phasesmith-single-crystal/solution", "dep:sha2"]

[dev-dependencies]
criterion = "0.7"
phasesmith-io = { version = "0.8.0", path = "../phasesmith-io" }

[[bench]]
name = "backgrounds"
harness = false

[[bench]]
name = "lebail"
harness = false

[[bench]]
name = "rietveld"
harness = false

[[bench]]
name = "space_group"
harness = false
required-features = ["single-crystal"]

[lints]
workspace = true
