[package]
name = "phasesmith-persistence"
description = "Canonical native project persistence and reporting for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
phasesmith-core = { path = "../phasesmith-core" }
phasesmith-engine = { path = "../phasesmith-engine" }
phasesmith-execution = { path = "../phasesmith-execution" }
phasesmith-model = { path = "../phasesmith-model" }
phasesmith-workflows = { path = "../phasesmith-workflows" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
zip = { version = "=5.1.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
