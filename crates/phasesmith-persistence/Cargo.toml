[package]
name = "phasesmith-persistence"
description = "Canonical native project persistence and reporting for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
phasesmith-core = { version = "0.3.0", path = "../phasesmith-core" }
phasesmith-crystallography = { version = "0.3.0", path = "../phasesmith-crystallography" }
phasesmith-engine = { version = "0.3.0", path = "../phasesmith-engine" }
phasesmith-execution = { version = "0.3.0", path = "../phasesmith-execution" }
phasesmith-model = { version = "0.3.0", path = "../phasesmith-model" }
phasesmith-workflows = { version = "0.3.0", path = "../phasesmith-workflows" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
zip = { version = "=5.1.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
