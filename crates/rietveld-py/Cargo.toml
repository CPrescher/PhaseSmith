[package]
name = "rietveld-py"
description = "Python bindings for Rietveld Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
npy = { package = "numpy", version = "0.27" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
rietveld-core = { path = "../rietveld-core" }

[lints]
workspace = true
