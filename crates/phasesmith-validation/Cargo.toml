[package]
name = "phasesmith-validation"
description = "Python-free real-data validation contracts and dataset verification for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[dependencies]
nalgebra = "0.35"
phasesmith-core = { version = "0.1.0", path = "../phasesmith-core" }
phasesmith-crystallography = { version = "0.1.0", path = "../phasesmith-crystallography" }
phasesmith-engine = { version = "0.1.0", path = "../phasesmith-engine" }
phasesmith-execution = { version = "0.1.0", path = "../phasesmith-execution" }
phasesmith-io = { version = "0.1.0", path = "../phasesmith-io" }
phasesmith-model = { version = "0.1.0", path = "../phasesmith-model" }
phasesmith-workflows = { version = "0.1.0", path = "../phasesmith-workflows" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[[bin]]
name = "phasesmith-validation"
path = "src/bin/phasesmith-validation.rs"

[lints]
workspace = true
