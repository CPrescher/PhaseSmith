[package]
name = "phasesmith-validation"
description = "Python-free real-data validation contracts and dataset verification for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nalgebra = "0.35"
phasesmith-core = { path = "../phasesmith-core" }
phasesmith-crystallography = { path = "../phasesmith-crystallography" }
phasesmith-engine = { path = "../phasesmith-engine" }
phasesmith-execution = { path = "../phasesmith-execution" }
phasesmith-io = { path = "../phasesmith-io" }
phasesmith-model = { path = "../phasesmith-model" }
phasesmith-workflows = { path = "../phasesmith-workflows" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints]
workspace = true
