[package]
name = "phasesmith-py"
description = "Python bindings for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
phasesmith = { version = "0.8.2", path = "../phasesmith-rs", default-features = false, optional = true }
phasesmith-hdf5 = { version = "0.8.2", path = "../phasesmith-hdf5", optional = true }
phasesmith-single-crystal = { version = "0.8.2", path = "../phasesmith-single-crystal", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
npy = { package = "numpy", version = "0.27" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
phasesmith-core = { version = "0.8.2", path = "../phasesmith-core" }
phasesmith-engine = { version = "0.8.2", path = "../phasesmith-engine" }
phasesmith-execution = { version = "0.8.2", path = "../phasesmith-execution" }
phasesmith-io = { version = "0.8.2", path = "../phasesmith-io" }
phasesmith-model = { version = "0.8.2", path = "../phasesmith-model" }
phasesmith-persistence = { version = "0.8.2", path = "../phasesmith-persistence" }
phasesmith-validation = { version = "0.8.2", path = "../phasesmith-validation" }
phasesmith-workflows = { version = "0.8.2", path = "../phasesmith-workflows" }

[lints]
workspace = true

[features]
default = ["single-crystal"]
single-crystal = ["spots", "solution", "row-search"]
hdf5 = ["dep:phasesmith-hdf5", "dep:phasesmith", "phasesmith/single-crystal-files", "dep:serde_json"]
spots = ["phasesmith-single-crystal/spots"]
solution = ["phasesmith-single-crystal/solution"]
row-search = ["phasesmith-single-crystal/row-search", "dep:serde_json"]
