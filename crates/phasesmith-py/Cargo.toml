[package]
name = "phasesmith-py"
description = "Python bindings for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
phasesmith = { workspace = true, optional = true }
phasesmith-hdf5 = { workspace = true, optional = true }
phasesmith-single-crystal = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
npy = { workspace = true }
pyo3 = { workspace = true }
phasesmith-core = { workspace = true }
phasesmith-engine = { workspace = true }
phasesmith-execution = { workspace = true }
phasesmith-io = { workspace = true }
phasesmith-model = { workspace = true }
phasesmith-persistence = { workspace = true }
phasesmith-validation = { workspace = true }
phasesmith-workflows = { workspace = true }

[lints]
workspace = true

[features]
default = ["single-crystal"]
single-crystal = ["spots", "solution", "row-search"]
hdf5 = ["dep:phasesmith-hdf5", "dep:phasesmith", "phasesmith?/single-crystal-files", "dep:serde_json"]
spots = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/spots"]
solution = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/solution"]
row-search = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/row-search", "dep:serde_json"]
