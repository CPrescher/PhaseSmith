[package]
name = "phasesmith-py"
description = "Python bindings for PhaseSmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
npy = { package = "numpy", version = "0.27" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
phasesmith-core = { path = "../phasesmith-core" }
phasesmith-engine = { path = "../phasesmith-engine" }
phasesmith-execution = { path = "../phasesmith-execution" }

[lints]
workspace = true
