[package]
name = "phasesmith"
description = "Powder and single-crystal diffraction calculation and analysis library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["diffraction", "rietveld", "crystallography", "powder", "science"]
categories = ["science"]

[dependencies]
phasesmith-row-search = { version = "0.8.0", path = "../phasesmith-row-search", optional = true }
phasesmith-hdf5 = { version = "0.8.0", path = "../phasesmith-hdf5", optional = true }
phasesmith-solution = { version = "0.8.0", path = "../phasesmith-solution", optional = true }
phasesmith-spots = { version = "0.8.0", path = "../phasesmith-spots", optional = true }
phasesmith-core = { version = "0.8.0", path = "../phasesmith-core" }
phasesmith-crystallography = { version = "0.8.0", path = "../phasesmith-crystallography" }
phasesmith-engine = { version = "0.8.0", path = "../phasesmith-engine" }
phasesmith-execution = { version = "0.8.0", path = "../phasesmith-execution" }
phasesmith-io = { version = "0.8.0", path = "../phasesmith-io" }
phasesmith-model = { version = "0.8.0", path = "../phasesmith-model" }
phasesmith-persistence = { version = "0.8.0", path = "../phasesmith-persistence" }
phasesmith-workflows = { version = "0.8.0", path = "../phasesmith-workflows" }

[lints]
workspace = true

[features]
default = ["single-crystal"]
single-crystal = ["spots", "solution", "row-search", "phasesmith-workflows/single-crystal"]
hdf5 = ["dep:phasesmith-hdf5"]
spots = ["dep:phasesmith-spots"]
solution = ["dep:phasesmith-solution"]
row-search = ["dep:phasesmith-row-search"]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[[example]]
name = "single_crystal_workflow"
required-features = ["single-crystal", "hdf5"]
