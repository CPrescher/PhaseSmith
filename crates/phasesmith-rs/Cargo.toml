[package]
name = "phasesmith"
description = "Powder and single-crystal diffraction analysis in Rust and Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["diffraction", "rietveld", "crystallography", "powder", "single-crystal"]
categories = ["science"]

[dependencies]
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
phasesmith-single-crystal = { workspace = true, optional = true }
phasesmith-hdf5 = { workspace = true, optional = true }
phasesmith-core = { workspace = true }
phasesmith-crystallography = { workspace = true }
phasesmith-engine = { workspace = true }
phasesmith-execution = { workspace = true }
phasesmith-io = { workspace = true }
phasesmith-model = { workspace = true }
phasesmith-persistence = { workspace = true }
phasesmith-workflows = { workspace = true }

[lints]
workspace = true

[features]
default = ["single-crystal"]
single-crystal = ["spots", "solution", "row-search", "grains", "phasesmith-workflows/single-crystal"]
single-crystal-files = ["single-crystal", "hdf5"]
hdf5 = ["dep:phasesmith-hdf5", "dep:serde_json", "dep:sha2"]
spots = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/spots"]
solution = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/solution"]
row-search = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/row-search"]
grains = ["dep:phasesmith-single-crystal", "phasesmith-single-crystal?/grains"]

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[[example]]
name = "single_crystal_workflow"
required-features = ["single-crystal", "hdf5"]
