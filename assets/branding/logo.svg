<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PhaseSmith logo: three lattice planes on a phase color scale, lit from the plane normal">
  <defs>
    <filter id="ps-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="ps-cp3">
      <polygon points="34,62 70,52 86,66 50,76"/>
    </clipPath>
    <clipPath id="ps-cp2">
      <polygon points="21,46 57,36 73,50 37,60"/>
    </clipPath>
    <linearGradient id="ps-p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ps-p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="ps-p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DB49B"/>
      <stop offset="1" stop-color="#0A5D4F"/>
    </linearGradient>
  </defs>
  <polygon points="34,62 70,52 86,66 50,76" fill="url(#ps-p3)" opacity="0.55"/>
  <polygon points="26,52 62,42 78,56 42,66" fill="#000000" opacity="0.38" filter="url(#ps-shadow)" clip-path="url(#ps-cp3)"/>
  <polygon points="21,46 57,36 73,50 37,60" fill="url(#ps-p2)" opacity="0.9"/>
  <polygon points="13,36 49,26 65,40 29,50" fill="#000000" opacity="0.4" filter="url(#ps-shadow)" clip-path="url(#ps-cp2)"/>
  <polygon points="8,30 44,20 60,34 24,44" fill="url(#ps-p1)"/>
</svg>
