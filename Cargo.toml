[workspace]
members = [
  "apps/phasesmith-desktop/src-tauri",
  "crates/phasesmith-rs",
  "crates/phasesmith-core",
  "crates/phasesmith-crystallography",
  "crates/phasesmith-desktop",
  "crates/phasesmith-execution",
  "crates/phasesmith-engine",
  "crates/phasesmith-io",
  "crates/phasesmith-model",
  "crates/phasesmith-persistence",
  "crates/phasesmith-py",
  "crates/phasesmith-validation",
  "crates/phasesmith-workflows",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PhaseSmith contributors"]
license = "MIT"
homepage = "https://github.com/CPrescher/PhaseSmith"
repository = "https://github.com/CPrescher/PhaseSmith"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
