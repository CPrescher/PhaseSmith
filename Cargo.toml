[workspace]
members = [
  "crates/phasesmith-core",
  "crates/phasesmith-crystallography",
  "crates/phasesmith-engine",
  "crates/phasesmith-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PhaseSmith contributors"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
